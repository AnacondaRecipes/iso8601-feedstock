{% set version = "1.0.2" %}

package:
  name: iso8601
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/i/iso8601/iso8601-{{ version }}.tar.gz
  sha256: 27f503220e6845d9db954fb212b95b0362d8b7e6c1b2326a87061c3de93594b1

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
    - poetry-core >=1.0.0
  run:
    - python >=3.6.2,<4.0

test:
  imports:
    - iso8601
  requires:
    - pip
    - python <3.10
  commands:
    - pip check

about:
  home: https://github.com/micktwomey/pyiso8601
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Simple module to parse ISO 8601 dates'
  doc_url: http://pyiso8601.readthedocs.io/en/latest/
  dev_url: https://github.com/micktwomey/pyiso8601

extra:
    recipe-maintainers:
    - ChrisBarker-NOAA
    - JamesMakela-NOAA
    - ocefpaf
