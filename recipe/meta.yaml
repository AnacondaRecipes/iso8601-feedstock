{% set name = "iso8601" %}
{% set version = "2.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6b1d3829ee8921c4301998c909f7829fa9ed3cbdac0d3b16af2d743aed1ba8df

build:
  number: 0
  skip: true  # [py<37]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
    - poetry-core >=1.0.0
  run:
    - python

test:
  source_files:
    - iso8601
  imports:
    - iso8601
    - hypothesis.extra
    - hypothesis.strategies
  requires:
    - pip
    - pytest
    - hypothesis
    - pytz
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -ra -vvv iso8601/test_iso8601.py

about:
  home: https://github.com/micktwomey/pyiso8601
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Simple module to parse ISO 8601 dates
  description: |
    This module parses the most common forms of ISO 8601
    date strings (e.g. 2007-01-14T20:34:22+00:00) into datetime objects
  doc_url: https://pyiso8601.readthedocs.io
  dev_url: https://github.com/micktwomey/pyiso8601

extra:
    recipe-maintainers:
    - ChrisBarker-NOAA
    - JamesMakela-NOAA
    - ocefpaf
